# Jellyfin media server
# Docs: https://jellyfin.org/docs/general/installation/ (verified HTTP 200)
# Web UI: http://localhost:8096  (HTTPS: https://localhost:8920)
# Media folders live in ./media on the host — put your files there.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media
    restart: unless-stopped
